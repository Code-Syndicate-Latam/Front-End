 <!-- Contenedor principal para centrar el formulario -->
    <div class="min-h-screen flex items-center justify-center my-4">
        <!-- Tarjeta del formulario -->
        <div class="bg-white p-8 rounded-lg w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">
              <img src="../../../assets/img/Logo.png" alt="Urbe" width="224px" height="50px" class="justify-center mx-auto mb-4"/>
            </h2>
            <form action="#" method="POST">
                <!-- Campo Email -->
                <div class="my-8">
                    <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded-full w-full py-2  px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Correo Electrónico">
                </div>

                <!-- Campo Contraseña -->
                <div class="my-8">
                    <input type="password" id="password" name="password"
                    class="shadow appearance-none border rounded-full w-full py-2 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Contraseña">
                </div>

                <!-- Botón de Login -->
                <div class="flex flex-col items-center justify-center my-8">
                  <button type="submit" class="btn btn-block border rounded-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mb-2">
                  Iniciar Sesión
                  </button>
                    <a href="#" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800 my-2">
                    ¿Olvidaste tu contraseña?
                    </a>
                    <a routerLink="register" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800 my-2">
                    Registrate
                    </a>
                </div>
            </form>
        </div>
    </div>
