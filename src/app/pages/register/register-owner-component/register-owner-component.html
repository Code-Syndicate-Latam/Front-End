 <!-- Contenedor principal -->
<div class="container-flex card bg-base-100 min-h-screen justify-center p-4">
  <div class="card">
    <img src="../../../assets/img/Logo.png" height="50" width="150" alt="Logo Urbe" class="gap-4 p-4 mb-12"/>
  </div>

  <div class="rounded-lg w-full max-w-md justify-center mx-auto my-8">
        <h2 class="text-center text-2xl font-bold">Crea tu Cuenta</h2>
        <!-- Tarjeta del formulario -->
        <div class="rounded-lg w-full max-w-md">
            <form action="#" method="POST">

                <!-- Nombre Completo -->
                <div class="my-4">
                    <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded-full w-full py-2  px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Nombre Completo*">
                </div>

                <!-- Celular -->
                <div class="my-4">
                    <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded-full w-full py-2  px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Celular ó (WhatsApp)*">
                </div>

                <!-- Identificación -->
                <div class="my-4">
                    <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded-full w-full py-2  px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="No. de Identificación (C.C ó NIT)*">
                </div>

                <!-- Matricula -->
                <div class="my-4">
                    <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded-full w-full py-2  px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Matricula Inmobiliaria*">
                </div>

                <!-- Cerro Electrónico -->
                <div class="my-4">
                    <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded-full w-full py-2  px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Cerro Electrónico*">
                </div>

                <!-- Campo Contraseña -->
                <div class="my-4">
                    <input type="password" id="password" name="password"
                    class="shadow appearance-none border rounded-full w-full py-2 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Contraseña*">
                </div>

                <label class="label">
                  <input type="checkbox" class="checkbox checkbox-success text-blue-500 hover:text-blue-800"/>
                  Acepto los <a href="#" class="text-blue-500 hover:text-blue-800">Términos y Condiciones*</a>
                </label>

                <!-- Botón de Login -->
                <div class="flex flex-col items-center justify-center">
                  <button type="submit" class="btn btn-block border rounded-full bg-orange-600 hover:bg-orange-700 text-white font-bold px-4 rounded focus:outline-none focus:shadow-outline">
                  Registrarme
                  </button>
                </div>

            </form>
        </div>
  </div>
</div>
